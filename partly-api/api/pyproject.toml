[project]
name = "hackathon-2026-bundle-api"
version = "0.1.0"
description = "Offline FastAPI service serving the hackathon-2026 dataset"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
